<!DOCTYPE html>
<html>
<head>
  <!--

    it to work correctly.

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="f1prodeflutter">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="logof1 copy.png"/>

  <title>f1prodeflutter</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // The value below is injected by flutter build, do not touch.
    const serviceWorkerVersion = '"833291621"';
  </script>
  <!-- This script adds the flutter initialization JS code -->
  <script src="flutter.js" defer></script>
  <script>
    // Función para detectar y procesar rutas de reset de contraseña
    function detectAndProcessResetPasswordRoute() {
      // Verificar si hay una ruta en el hash (modo history)
      let initialRoute = null;
      
      console.log('URL actual:', window.location.href);
      console.log('Hash:', window.location.hash);
      console.log('Path:', window.location.pathname);
      
      // Detectar primero en el hash (prioridad, ya que usamos HashUrlStrategy)
      if (window.location.hash && window.location.hash.includes('reset-password')) {
        console.log('Detectada ruta de reset password en hash:', window.location.hash);
        // Usar directamente el hash como ruta inicial
        initialRoute = window.location.hash;
        return initialRoute;
      }
      
      // Intentar detectar en el pathname (para URLs sin hash)
      if (window.location.pathname.includes('reset-password')) {
        console.log('Detectada ruta de reset password en pathname:', window.location.pathname);
        // Convertir a formato hash
        initialRoute = '#' + window.location.pathname;
        return initialRoute;
      }
      
      return null;
    }

    window.addEventListener('load', async function() {
      try {
        // Inicializar Flutter
        await flutter.load();
        
        // Detectar ruta inicial
        const initialRoute = detectAndProcessResetPasswordRoute();
        console.log('Ruta inicial detectada:', initialRoute);

        // Configurar y ejecutar la aplicación
        const engineInitializer = await flutter.initializeEngine({
          hostElement: document.querySelector('#flutter_app'),
          initialRoute: initialRoute
        });

        await engineInitializer.autoStart();
        console.log('Aplicación Flutter iniciada correctamente');
        
        // Agregar listener para cambios en la URL después de iniciar la app
        window.addEventListener('hashchange', function() {
          console.log('Hash cambiado a:', window.location.hash);
        });
      } catch (e) {
        console.error('Error al inicializar Flutter:', e);
      }
    });
  </script>
</head>
<body>
  <div id="flutter_app"></div>
</body>
</html>
