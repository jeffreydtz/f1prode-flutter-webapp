<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/f1prode-flutter-webapp/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="f1prodeflutter">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="logof1 copy.png"/>

  <title>f1prodeflutter</title>
  <link rel="manifest" href="manifest.json">
  
  <!-- Estilos para asegurar que Flutter tenga un contenedor válido -->
  <style>
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      color: white;
    }
    
    html {
      width: 100%;
      height: 100%;
    }
    
    #flutter_app {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .loading-indicator {
      font-family: 'Arial', sans-serif;
      text-align: center;
      font-size: 16px;
    }
    
    .loading-spinner {
      border: 4px solid rgba(255, 0, 0, 0.3);
      border-radius: 50%;
      border-top: 4px solid #ff0000;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    /* Panel de depuración desactivado */
  </style>

  <script>
    // The value below is injected by flutter build, do not touch.
    const serviceWorkerVersion = "719621976";
  </script>
  
  <!-- Carga el script de flutter.js con verificación de carga -->
  <script>
    // Función para depuración - desactivada completamente
    function mostrarDebug(mensaje) {
      // Función desactivada completamente - no muestra ningún mensaje
      // Descomentar la siguiente línea solo durante desarrollo
      // console.log(mensaje);
    }
    
    document.addEventListener('DOMContentLoaded', function() {
      // Crear indicador de carga
      mostrarIndicadorCarga();
      
      // Detectar la URL base para cargar recursos correctamente
      var baseUrl = detectarURLBase();
      
      // Intentar cargar flutter.js
      cargarFlutterJS(baseUrl);
    });

    function mostrarIndicadorCarga() {
      var loadingIndicator = document.createElement('div');
      loadingIndicator.className = 'loading-indicator';
      loadingIndicator.innerHTML = '<div class="loading-spinner"></div><p>Cargando F1 Prode...</p>';
      document.getElementById('flutter_app').appendChild(loadingIndicator);
      
      // Actualizar los estilos por si no se cargaron correctamente desde el CSS
      var style = document.createElement('style');
      style.textContent = `
        .loading-indicator {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          height: 100vh;
          font-family: Arial, sans-serif;
          color: #E10600; /* Color rojo F1 */
        }
        .loading-spinner {
          border: 4px solid rgba(225, 6, 0, 0.3); /* Color rojo F1 con transparencia */
          border-radius: 50%;
          border-top: 4px solid #E10600; /* Color rojo F1 */
          width: 50px;
          height: 50px;
          animation: spin 1s linear infinite;
          margin-bottom: 20px;
        }
        @keyframes spin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
      `;
      document.head.appendChild(style);
    }

    function detectarURLBase() {
      var scriptSrc = document.querySelector('script[src*="flutter.js"]');
      
      if (scriptSrc) {
        var src = scriptSrc.getAttribute('src');
        var baseUrl = src.substring(0, src.indexOf('flutter.js'));
        mostrarDebug('URL base encontrada desde script: ' + baseUrl);
        return baseUrl;
      }
      
      // Intentar detectar desde base href
      var baseHref = document.querySelector('base')?.getAttribute('href');
      if (baseHref) {
        // Asegurarse de que termina con '/'
        if (!baseHref.endsWith('/')) {
          baseHref += '/';
        }
        mostrarDebug('URL base encontrada desde base href: ' + baseHref);
        return baseHref;
      }
      
      // Fallback a paths alternativos basados en URL actual
      var posiblesRutas = [
        '/',                           // Root del dominio
        '/f1prode-flutter-webapp/',    // Subpath específico
        window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/') + 1) // Directorio actual
      ];
      
      mostrarDebug('No se encontró base href. Usando fallbacks: ' + posiblesRutas.join(', '));
      return posiblesRutas[1]; // Por defecto usamos /f1prode-flutter-webapp/
    }

    function cargarFlutterJS(baseUrl) {
      var urlsAProbar = [
        baseUrl + 'flutter.js',
        '/flutter.js',
        '/f1prode-flutter-webapp/flutter.js',
        'https://jeffreydtz.github.io/f1prode-flutter-webapp/flutter.js'
      ];
      
      // Eliminar duplicados
      urlsAProbar = [...new Set(urlsAProbar)];
      
      mostrarDebug('Intentando cargar flutter.js desde: ' + urlsAProbar.join(', '));
      
      // Intentar cargar flutter.js secuencialmente desde diferentes URLs
      cargarFlutterJSSecuencial(urlsAProbar, 0, baseUrl);
    }

    function cargarFlutterJSSecuencial(urls, indice, baseUrl) {
      if (indice >= urls.length) {
        mostrarDebug('ERROR: No se pudo cargar flutter.js desde ninguna URL');
        document.getElementById('flutter_app').innerHTML = '<div style="color: red; padding: 20px; background: #500; margin: 20px; border-radius: 5px; font-family: sans-serif; text-align: center;"><h2>Error al cargar Flutter</h2><p>No se pudo encontrar el archivo flutter.js. Por favor, verifica la configuración del servidor.</p><button onclick="location.reload()" style="padding: 10px 20px; background: #f00; color: white; border: none; border-radius: 5px; cursor: pointer;">Recargar</button></div>';
        return;
      }
      
      var script = document.createElement('script');
      script.src = urls[indice];
      
      mostrarDebug('Intentando cargar flutter.js desde: ' + urls[indice]);
      
      script.onload = function() {
        mostrarDebug('Carga de flutter.js exitosa desde: ' + urls[indice]);
        
        // Verificar existencia de manifest.json
        verificarRecurso(baseUrl + 'manifest.json', function(existe) {
          if (!existe) {
            mostrarDebug('ADVERTENCIA: No se pudo encontrar manifest.json en ' + baseUrl + 'manifest.json');
          }
          
          // Iniciar carga de Flutter
          setTimeout(function() {
            iniciarFlutter(baseUrl);
          }, 100);
        });
      };
      
      script.onerror = function() {
        mostrarDebug('Error al cargar flutter.js desde: ' + urls[indice]);
        // Probar con la siguiente URL
        cargarFlutterJSSecuencial(urls, indice + 1, baseUrl);
      };
      
      document.head.appendChild(script);
    }
    
    function verificarRecurso(url, callback) {
      var xhr = new XMLHttpRequest();
      xhr.open('HEAD', url, true);
      xhr.onload = function() {
        callback(xhr.status !== 404);
      };
      xhr.onerror = function() {
        callback(false);
      };
      xhr.send();
    }
    
    // Función para detectar rutas de reset de contraseña
    function detectResetPasswordRoute() {
      mostrarDebug('URL actual: ' + window.location.href);
      mostrarDebug('Hash: ' + window.location.hash);
      mostrarDebug('Path: ' + window.location.pathname);
      
      // Formato específico: "/#/reset-password/MQ/cmm3wd-5a276a95295c7a14044f05380083a580"
      const resetPasswordRegex = /\/#\/reset-password\/([^\/]+)\/([^\/]+)$/;
      
      // Comprueba la URL completa
      const fullUrlMatch = window.location.href.match(resetPasswordRegex);
      if (fullUrlMatch) {
        const uid = fullUrlMatch[1];
        const token = fullUrlMatch[2];
        mostrarDebug(`MATCH EXACTO: UID=${uid}, Token=${token}`);
        return window.location.hash;
      }
      
      // Detectar en el hash (método tradicional)
      if (window.location.hash && window.location.hash.includes('reset-password')) {
        mostrarDebug('Detectada ruta de reset password en hash: ' + window.location.hash);
        
        // Verificar formato específico: extraer uid y token
        var matchResetPassword = window.location.hash.match(/\/reset-password\/([^\/]+)\/([^\/]+)$/);
        if (matchResetPassword) {
          var uid = matchResetPassword[1];
          var token = matchResetPassword[2];
          mostrarDebug('UID extraído: ' + uid + ', Token extraído: ' + token);
        }
        
        return window.location.hash;
      }
      
      // Verificar si la URL completa contiene reset-password (algunos enlaces pueden venir así)
      if (window.location.href.includes('reset-password')) {
        mostrarDebug('Detectada ruta de reset password en URL completa');
        
        // Extraer la parte después de reset-password
        var urlParts = window.location.href.split('reset-password');
        if (urlParts.length > 1) {
          var resetPath = '/reset-password' + urlParts[1];
          mostrarDebug('Ruta de reset reconstruida: ' + resetPath);
          return '#' + resetPath;
        }
      }
      
      // Intentar detectar en el pathname
      if (window.location.pathname.includes('reset-password')) {
        mostrarDebug('Detectada ruta de reset password en pathname: ' + window.location.pathname);
        return '#' + window.location.pathname;
      }
      
      return null;
    }

    // Función para iniciar Flutter
    function iniciarFlutter(baseUrl) {
      if (typeof _flutter === 'undefined') {
        mostrarDebug('_flutter no está definido. Comprobando alternativas...');
        
        if (typeof window.flutter !== 'undefined') {
          mostrarDebug('Usando la API moderna de Flutter...');
          // Método moderno
          iniciarFlutterModerno(baseUrl);
          return;
        }
        
        mostrarDebug('ERROR: No se encuentra ninguna API de Flutter');
        document.getElementById('flutter_app').innerHTML = '<div style="color: red; padding: 20px; background: #500; margin: 20px; border-radius: 5px; font-family: sans-serif; text-align: center;"><h2>Error al cargar Flutter</h2><p>No se pudo cargar la aplicación. Por favor, intenta recargar la página.</p><button onclick="location.reload()" style="padding: 10px 20px; background: #f00; color: white; border: none; border-radius: 5px; cursor: pointer;">Recargar</button></div>';
        return;
      }
      
      mostrarDebug('Iniciando carga de Flutter con método clásico...');
      mostrarDebug('URL base para recursos: ' + baseUrl);
      
      // Detectar ruta inicial
      var initialRoute = detectResetPasswordRoute();
      mostrarDebug('Ruta inicial detectada: ' + (initialRoute || 'null'));
      
      try {
        // Initialize Flutter using the old method
        _flutter.loader.loadEntrypoint({
          serviceWorker: {
            serviceWorkerVersion: serviceWorkerVersion,
          },
          onEntrypointLoaded: async function(engineInitializer) {
            mostrarDebug('Entrypoint cargado, iniciando engine...');
            
            try {
              // Limpiar indicador de carga antes de inicializar el engine
              document.getElementById('flutter_app').innerHTML = '';
              
              var appRunner = await engineInitializer.initializeEngine({
                hostElement: document.querySelector('#flutter_app'),
                initialRoute: initialRoute,
                assetBase: baseUrl,
              });
              
              mostrarDebug('Engine inicializado, ejecutando app...');
              
              await appRunner.runApp();
              
              mostrarDebug('Aplicación Flutter iniciada correctamente');
            } catch (e) {
              mostrarDebug('ERROR al inicializar el engine: ' + e.message);
              document.getElementById('flutter_app').innerHTML = '<div style="color: red; padding: 20px; background: #500; margin: 20px; border-radius: 5px; font-family: sans-serif; text-align: center;"><h2>Error al inicializar Flutter</h2><p>' + e.message + '</p><button onclick="location.reload()" style="padding: 10px 20px; background: #f00; color: white; border: none; border-radius: 5px; cursor: pointer;">Recargar</button></div>';
            }
          }
        });
      } catch (e) {
        mostrarDebug('ERROR en loadEntrypoint: ' + e.message);
        document.getElementById('flutter_app').innerHTML = '<div style="color: red; padding: 20px; background: #500; margin: 20px; border-radius: 5px; font-family: sans-serif; text-align: center;"><h2>Error al cargar Flutter</h2><p>' + e.message + '</p><button onclick="location.reload()" style="padding: 10px 20px; background: #f00; color: white; border: none; border-radius: 5px; cursor: pointer;">Recargar</button></div>';
      }
    }
    
    // Método moderno para iniciar Flutter (como fallback)
    async function iniciarFlutterModerno(baseUrl) {
      try {
        mostrarDebug('Intentando cargar Flutter con método moderno...');
        mostrarDebug('URL base para recursos: ' + baseUrl);
        
        await flutter.load();
        
        // Detectar ruta inicial
        const initialRoute = detectResetPasswordRoute();
        mostrarDebug('Ruta inicial detectada (moderno): ' + (initialRoute || 'null'));

        // Limpiar indicador de carga antes de inicializar el engine
        document.getElementById('flutter_app').innerHTML = '';
        
        // Configurar y ejecutar la aplicación
        const engineInitializer = await flutter.initializeEngine({
          hostElement: document.querySelector('#flutter_app'),
          initialRoute: initialRoute,
          assetBase: baseUrl,
        });

        await engineInitializer.autoStart();
        mostrarDebug('Aplicación Flutter iniciada correctamente (moderno)');
      } catch (e) {
        mostrarDebug('ERROR al inicializar Flutter (método moderno): ' + e.message);
        document.getElementById('flutter_app').innerHTML = '<div style="color: red; padding: 20px; background: #500; margin: 20px; border-radius: 5px; font-family: sans-serif; text-align: center;"><h2>Error al inicializar Flutter</h2><p>' + e.message + '</p><button onclick="location.reload()" style="padding: 10px 20px; background: #f00; color: white; border: none; border-radius: 5px; cursor: pointer;">Recargar</button></div>';
      }
    }
    
    // Agregar listener para cambios en la URL después de iniciar la app
    window.addEventListener('hashchange', function() {
      mostrarDebug('Hash cambiado a: ' + window.location.hash);
    });
  </script>
</head>
<body>
  <div id="flutter_app"></div>
</body>
</html>
