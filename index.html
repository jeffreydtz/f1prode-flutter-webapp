<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="f1prodeflutter">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="logof1 copy.png"/>

  <title>f1prodeflutter</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // The value below is injected by flutter build, do not touch.
    const serviceWorkerVersion = "1778999371";
  </script>
  <script src="flutter.js" defer></script>
  <script>
    // Función para detectar rutas de reset de contraseña
    function detectResetPasswordRoute() {
      console.log('URL actual:', window.location.href);
      console.log('Hash:', window.location.hash);
      console.log('Path:', window.location.pathname);
      
      // Detectar primero en el hash
      if (window.location.hash && window.location.hash.includes('reset-password')) {
        console.log('Detectada ruta de reset password en hash:', window.location.hash);
        return window.location.hash;
      }
      
      // Intentar detectar en el pathname
      if (window.location.pathname.includes('reset-password')) {
        console.log('Detectada ruta de reset password en pathname:', window.location.pathname);
        return '#' + window.location.pathname;
      }
      
      return null;
    }

    window.addEventListener('load', function(ev) {
      console.log('Iniciando carga de Flutter...');
      
      // Detectar ruta inicial
      var initialRoute = detectResetPasswordRoute();
      console.log('Ruta inicial detectada:', initialRoute);
      
      // Initialize Flutter using the old method (more compatible)
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        },
        onEntrypointLoaded: async function(engineInitializer) {
          console.log('Entrypoint cargado, iniciando engine...');
          
          const appRunner = await engineInitializer.initializeEngine({
            hostElement: document.querySelector('#flutter_app'),
            initialRoute: initialRoute
          });
          
          console.log('Engine inicializado, ejecutando app...');
          await appRunner.runApp();
          
          console.log('Aplicación Flutter iniciada correctamente');
        }
      });
      
      // Agregar listener para cambios en la URL después de iniciar la app
      window.addEventListener('hashchange', function() {
        console.log('Hash cambiado a:', window.location.hash);
      });
    });
  </script>
</head>
<body>
  <div id="flutter_app"></div>
</body>
</html>
