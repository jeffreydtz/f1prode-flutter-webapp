<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>F1 Prode - Página no encontrada</title>
  <script type="text/javascript">
    // Redirigir cualquier ruta a la app principal con el hash
    window.onload = function() {
      // Obtener la ruta completa incluyendo el hash
      var path = window.location.pathname;
      var hash = window.location.hash;
      var query = window.location.search;
      
      console.log('404 - Ruta detectada:', path);
      console.log('Hash detectado:', hash);
      
      // Construir la URL de redirección
      var basePath = '/f1prode-flutter-webapp/';
      
      // Si ya hay un hash en la URL, usarlo
      if (hash && hash.length > 0) {
        // Simplemente redirigir a la base con el hash existente
        window.location.href = basePath + hash + query;
      } 
      // Si la ruta contiene reset-password, convertirla en hash
      else if (path.includes('reset-password')) {
        // Si es una ruta de reset, agregarla como hash
        window.location.href = basePath + '#' + path + query;
      }
      // Cualquier otra ruta
      else {
        // Redirigir a la aplicación principal
        window.location.href = basePath;
      }
    };
  </script>
</head>
<body>
  <h2>Redirigiendo...</h2>
  <p>Estás siendo redirigido a la aplicación principal.</p>
</body>
</html>
